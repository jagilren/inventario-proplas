name: Respaldo semanal de la base de datos

# Supabase en plan gratuito NO hace respaldos automáticos: si la base se
# daña o se borra, no hay de dónde volver. Esto lo suple.
#
# POR QUÉ VA CIFRADO: los artefactos de un repositorio PÚBLICO los puede
# descargar cualquiera. El respaldo lleva costos, precios y nombres de
# clientes, así que se cifra ANTES de subirlo. Aunque alguien baje el
# archivo, sin la clave no le sirve de nada. Si algún día el repositorio
# pasa a privado, el cifrado igual sobra pero no estorba.
#
# QUÉ INCLUYE (las cuatro piezas hacen falta para reconstruir de cero):
#   · esquema.sql — tablas, funciones, triggers y políticas RLS
#   · datos.sql   — todas las filas del esquema `public`
#   · cuentas.sql — los usuarios del esquema `auth`
#   · roles.sql   — los roles del cluster
#
# POR QUÉ `cuentas.sql` VA APARTE: el volcado normal cubre solo el esquema
# `public`. Las cuentas de acceso viven en `auth`, y sin ellas se restauraría
# todo el inventario pero NADIE PODRÍA ENTRAR A LA APP: habría que recrear
# los usuarios a mano, y sus permisos (usuario_roles) apuntan a ids que ya no
# existirían. Lleva hashes de contraseña — otra razón para que todo esto vaya
# cifrado.
#
# SECRETOS QUE NECESITA (Settings → Secrets and variables → Actions):
#   · SUPABASE_DB_URL     cadena de conexión completa, CON la contraseña.
#                         Se saca de Supabase → Project Settings → Database
#                         → Connection string → URI, en modo "Session
#                         pooler" (los runners de GitHub son IPv4 y la
#                         conexión directa de Supabase es IPv6).
#   · BACKUP_PASSPHRASE   la clave para cifrar. Invéntala larga y guárdala
#                         en tu gestor de contraseñas: SIN ELLA EL RESPALDO
#                         NO SE PUEDE ABRIR. Nadie la puede recuperar.

on:
  schedule:
    # Lunes a las 07:00 UTC = 2:00 a. m. en Colombia, cuando nadie trabaja.
    - cron: '0 7 * * 1'
  # Permite lanzarlo a mano desde la pestaña Actions cuando se quiera.
  workflow_dispatch:

jobs:
  respaldo:
    name: Volcar, cifrar y guardar
    runs-on: ubuntu-latest
    steps:
      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Comprobar que los secretos existan
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          CLAVE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          # Se falla temprano y con un mensaje claro: sin esto, el error
          # aparecería más adelante disfrazado de "no pude conectar".
          if [ -z "$DB_URL" ]; then
            echo "Falta el secreto SUPABASE_DB_URL"; exit 1
          fi
          if [ -z "$CLAVE" ]; then
            echo "Falta el secreto BACKUP_PASSPHRASE"; exit 1
          fi

      - name: Volcar la base
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          supabase db dump --db-url "$DB_URL" -f esquema.sql
          supabase db dump --db-url "$DB_URL" --data-only --use-copy -f datos.sql
          supabase db dump --db-url "$DB_URL" --data-only --schema auth -f cuentas.sql
          supabase db dump --db-url "$DB_URL" --role-only -f roles.sql
          # Si alguno saliera vacío, el respaldo no sirve y hay que saberlo
          # ahora, no el día que se necesite restaurar.
          for f in esquema.sql datos.sql cuentas.sql; do
            if [ ! -s "$f" ]; then echo "$f quedó vacío"; exit 1; fi
          done
          # Comprobación específica: que `cuentas.sql` traiga usuarios de
          # verdad. Un archivo con solo cabeceras pesa poco pero no sirve.
          if ! grep -q 'auth"\?\."\?users' cuentas.sql; then
            echo "cuentas.sql no trae la tabla de usuarios"; exit 1
          fi
          ls -lh esquema.sql datos.sql cuentas.sql roles.sql

      - name: Cifrar
        env:
          CLAVE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          FECHA=$(date -u +%Y-%m-%d)
          tar czf "respaldo-$FECHA.tar.gz" esquema.sql datos.sql cuentas.sql roles.sql
          gpg --batch --yes --symmetric --cipher-algo AES256 \
              --passphrase "$CLAVE" "respaldo-$FECHA.tar.gz"
          rm -f esquema.sql datos.sql cuentas.sql roles.sql "respaldo-$FECHA.tar.gz"
          ls -lh "respaldo-$FECHA.tar.gz.gpg"

      - name: Guardar el artefacto
        uses: actions/upload-artifact@v5
        with:
          name: respaldo-bd
          path: '*.tar.gz.gpg'
          # Caduca solo: los respaldos rotan y no se acumulan para siempre,
          # que es justo lo que pasaría si se commitearan al repositorio
          # (git guarda cada versión y no la suelta nunca).
          retention-days: 90
          if-no-files-found: error

# CÓMO RESTAURAR (o simplemente comprobar que el respaldo sirve):
#   1. Descarga el artefacto desde la pestaña Actions.
#   2. gpg --decrypt respaldo-FECHA.tar.gz.gpg > respaldo.tar.gz
#      (pide la BACKUP_PASSPHRASE)
#   3. tar xzf respaldo.tar.gz
#   4. En este orden, contra un proyecto Supabase NUEVO y vacío:
#        psql "<conexión>" -f esquema.sql    (tablas, funciones, triggers)
#        psql "<conexión>" -f cuentas.sql    (usuarios: primero que los datos,
#                                             porque `profiles` apunta a ellos)
#        psql "<conexión>" -f datos.sql      (el inventario)
#
# Conviene hacer la prueba de restauración UNA VEZ contra un proyecto de
# Supabase vacío. Un respaldo que nunca se probó no es un respaldo: es una
# suposición.
