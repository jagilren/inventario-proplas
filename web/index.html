<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Gestión de inventarios PROPLAS">

  <!-- Auto-actualización del service worker (versionado por hash de Flutter):
       cuando el navegador activa una versión NUEVA del service worker, la
       página se recarga sola UNA vez para mostrarla. Así el usuario siempre
       ve la última versión sin limpiar caché ni recargar a mano, y conserva
       la carga rápida y el funcionamiento sin conexión. -->
  <script>
    if ('serviceWorker' in navigator) {
      // ¿ya había una versión controlando la página al cargar?
      var teniaControlador = !!navigator.serviceWorker.controller;
      var recargando = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (recargando) return;
        // Solo recargar cuando es una ACTUALIZACIÓN (no la primera instalación),
        // para no entrar en un bucle de recargas en la primera visita.
        if (teniaControlador) {
          recargando = true;
          window.location.reload();
        }
      });
    }
  </script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Inventario PROPLAS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Inventario PROPLAS</title>
  <link rel="manifest" href="manifest.json">

  <!-- Pantalla de carga: se ve AL INSTANTE (es HTML plano) mientras se
       descargan y arrancan los ~4 MB de main.dart.js. Sin esto el usuario
       se queda mirando una página en blanco, sin saber si la app está
       cargando o si se colgó. -->
  <style>
    #carga {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 18px;
      background: #00695C; color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity .35s ease;
    }
    #carga.oculto { opacity: 0; pointer-events: none; }
    #carga img { width: 84px; height: 84px; border-radius: 18px; }
    #carga .titulo { font-size: 19px; font-weight: 600; letter-spacing: .2px; }
    #carga .paso { font-size: 13.5px; opacity: .85; min-height: 20px;
                   text-align: center; padding: 0 24px; max-width: 340px; }
    /* Barra indeterminada: no sabemos el porcentaje real, pero el
       movimiento constante comunica que el proceso sigue vivo. */
    #carga .barra {
      width: 190px; height: 4px; border-radius: 4px;
      background: rgba(255,255,255,.25); overflow: hidden;
    }
    #carga .barra span {
      display: block; width: 40%; height: 100%; border-radius: 4px;
      background: #fff; animation: corre 1.15s ease-in-out infinite;
    }
    @keyframes corre {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
    @media (prefers-reduced-motion: reduce) {
      #carga .barra span { animation: none; width: 100%; opacity: .6; }
    }
  </style>
</head>
<body>
  <div id="carga">
    <img src="icons/Icon-192.png" alt="">
    <div class="titulo">Inventario PROPLAS</div>
    <div class="barra"><span></span></div>
    <div class="paso" id="carga-paso">Cargando la aplicación…</div>
  </div>

  <script>
    (function () {
      var paso = document.getElementById('carga-paso');
      var t0 = Date.now();
      // Mensajes escalonados: si algo va mal, el usuario se entera en vez de
      // quedarse esperando frente a un texto congelado.
      var avisos = [
        [ 6000, 'Descargando… la primera vez tarda un poco más.' ],
        [ 14000, 'Sigue cargando. Si tu conexión es lenta, puede demorar.' ],
        [ 28000, 'Está tardando más de lo normal. Revisa tu conexión a internet.' ],
      ];
      var timers = avisos.map(function (a) {
        return setTimeout(function () { if (paso) paso.textContent = a[1]; }, a[0]);
      });

      function quitar() {
        timers.forEach(clearTimeout);
        var c = document.getElementById('carga');
        if (!c) return;
        c.classList.add('oculto');
        setTimeout(function () { if (c.parentNode) c.parentNode.removeChild(c); }, 400);
        console.log('App lista en ' + ((Date.now() - t0) / 1000).toFixed(1) + ' s');
      }

      // Flutter avisa cuando pinta el primer cuadro: ahí ya hay algo que ver.
      window.addEventListener('flutter-first-frame', quitar);
      // Red de seguridad: si por lo que sea no llega ese evento, no dejar la
      // pantalla de carga tapando la app para siempre.
      setTimeout(quitar, 60000);
    })();
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
